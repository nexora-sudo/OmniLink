name: omnilink
description: Compartilhamento privado entre Windows e Android pela rede local.
publish_to: none
version: 0.1.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  basic_utils: ^5.8.2
  crypto: ^3.0.6
  path: ^1.9.1
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  sqlite3: ^3.0.0
  bonsoir: ^7.1.0
  file_picker: ^10.3.0
  desktop_drop:
    path: packages/desktop_drop
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  battery_plus: ^7.0.0
  share_plus: ^12.0.0
  cross_file: ^0.3.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true


